# Phase 1 - Steps 1.4 + 1.5: full stack (databases, ActiveMQ, auth, core).
# Same DB/ActiveMQ definitions as docker-compose.yml (step 1.3), plus the two services.
# Run with:  docker compose up -d --build
# Values come from .env (copy .env.example to .env and edit it).
# ${REGISTRY} is an optional image prefix such as docker.arvancloud.ir/ (keep the trailing slash).

name: notification-system

services:
  # ---------- Auth side ----------
  auth-db:
    image: ${REGISTRY:-}mysql:latest
    container_name: auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MYSQL_USER: ${AUTH_DB_USER}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - auth-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    # Build context = your clone of the course's auth repository (see AUTH_SRC in .env).
    # Copy phase1-docker/dockerfiles/auth/Dockerfile and .dockerignore into it first.
    build:
      context: ${AUTH_SRC:-../../fum-cloud-notification-auth-2025}
      dockerfile: Dockerfile
    image: auth:phase1
    container_name: auth
    restart: unless-stopped
    environment:
      PORT: ":50051"   # gRPC port; the HTTP port (8082) is hardcoded in the code
      DB_URL: "${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@tcp(auth-db:3306)/${AUTH_DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - auth-net        # reaches auth-db only
      - auth-core-net   # gRPC link to core (internal network)
    # Only HTTP is published, and only on the loopback interface.
    # 50051 is NOT published: it is reachable only through auth-core-net.
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-8082}:8082"

  # ---------- Core side ----------
  core-db:
    image: ${REGISTRY:-}postgres:13.13-bullseye
    container_name: core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  activemq:
    image: ${REGISTRY:-}webcenter/activemq:latest
    container_name: activemq
    restart: unless-stopped
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_USER}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_PASSWORD}
    volumes:
      - activemq-data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  core:
    build:
      context: ${CORE_SRC:-../../fum-cloud-notification-core-2025}
      dockerfile: Dockerfile
    image: core:phase1
    container_name: core
    restart: unless-stopped
    environment:
      PROJECT_DATASOURCE_JDBC_URL: "jdbc:postgresql://core-db:5432/${CORE_DB_NAME}"
      PROJECT_DATASOURCE_USERNAME: ${CORE_DB_USER}
      PROJECT_DATASOURCE_PASS: ${CORE_DB_PASSWORD}
      PROJECT_DATASOURCE_SCHEMA: ${PROJECT_DATASOURCE_SCHEMA:-public}
      ACTIVEMQ_URL: "failover:(tcp://activemq:61616)?randomize=true&jms.useAsyncSend=true&jms.sendTimeout=5000"
      ACTIVEMQ_USERNAME: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      AUTH_GRPC_ADDRESS: auth
      AUTH_GRPC_PORT: "50051"
      AUTH_SERVICE_BASE_URL: "http://auth:8082/"
      PROJECT_URL_CONFIG: "http://${NODE_IP:-localhost}:${CORE_HTTP_PORT:-8080}"
    depends_on:
      core-db:
        condition: service_healthy
      activemq:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - core-net        # reaches core-db and activemq only
      - auth-core-net   # gRPC link to auth (internal network)
    ports:
      - "127.0.0.1:${CORE_HTTP_PORT:-8080}:8080"

# One network per microservice (each holds the service + its own DB/broker).
# auth-core-net is "internal" (no gateway, no outside access) and holds ONLY auth and core,
# so it is the only path between the two services. Neither service can see the other's DB.
networks:
  auth-net:
  core-net:
  auth-core-net:
    internal: true

volumes:
  auth-db-data:
  core-db-data:
  activemq-data:
