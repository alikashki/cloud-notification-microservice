# hostPath data lives on worker2, so the Pod that uses this PV must be pinned to worker2
# (done with nodeSelector in the Deployment). DirectoryOrCreate: kubelet creates the
# directory on the node if it is missing, so no ssh/manual mkdir is needed.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: activemq-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /data/fum/activemq
    type: DirectoryOrCreate
