# hostPath data lives on worker1, so the Pod that uses this PV must be pinned to worker1
# (done with nodeSelector in the Deployment). DirectoryOrCreate: kubelet creates the
# directory on the node if it is missing, so no ssh/manual mkdir is needed.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: auth-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /data/fum/auth-db
    type: DirectoryOrCreate
