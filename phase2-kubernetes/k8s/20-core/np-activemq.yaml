# The broker accepts connections ONLY from the core Pods, and only on the OpenWire port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: activemq-ingress
  namespace: core
spec:
  podSelector:
    matchLabels:
      app: activemq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core
      ports:
        - protocol: TCP
          port: 61616
