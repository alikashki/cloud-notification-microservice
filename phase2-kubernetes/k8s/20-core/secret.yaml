# EXAMPLE VALUES - change every password and the JWT key before using this anywhere real.
# Credentials for the core side (namespace: core).
# The same credentials appear in several Secrets because each Pod reads them
# under different variable names. Keep the values identical.
apiVersion: v1
kind: Secret
metadata:
  name: core-db-secret
  namespace: core
type: Opaque
stringData:
  POSTGRES_USER: "core_user"
  POSTGRES_PASSWORD: "CorePass5163"
---
apiVersion: v1
kind: Secret
metadata:
  name: activemq-secret
  namespace: core
type: Opaque
stringData:
  ACTIVEMQ_ADMIN_LOGIN: "admin"
  ACTIVEMQ_ADMIN_PASSWORD: "MqPass2948"
---
apiVersion: v1
kind: Secret
metadata:
  name: core-secret
  namespace: core
type: Opaque
stringData:
  PROJECT_DATASOURCE_USERNAME: "core_user"
  PROJECT_DATASOURCE_PASS: "CorePass5163"
  ACTIVEMQ_USERNAME: "admin"
  ACTIVEMQ_PASSWORD: "MqPass2948"
