# PostgreSQL accepts connections ONLY from the core Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-db-ingress
  namespace: core
spec:
  podSelector:
    matchLabels:
      app: core-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core
      ports:
        - protocol: TCP
          port: 5432
