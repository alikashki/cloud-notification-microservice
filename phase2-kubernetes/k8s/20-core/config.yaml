# Non-sensitive settings for the core side (namespace: core)
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
  namespace: core
data:
  PROJECT_DATASOURCE_JDBC_URL: "jdbc:postgresql://core-db:5432/core_db"
  PROJECT_DATASOURCE_SCHEMA: "public"
  ACTIVEMQ_URL: "failover:(tcp://activemq:61616)?randomize=true&jms.useAsyncSend=true&jms.sendTimeout=5000"
  # The auth service lives in ANOTHER namespace, so we use its full DNS name:
  #   <service>.<namespace>.svc.cluster.local
  AUTH_GRPC_ADDRESS: "auth.auth.svc.cluster.local"
  AUTH_GRPC_PORT: "50051"
  AUTH_SERVICE_BASE_URL: "http://auth.auth.svc.cluster.local:8082/"
  # External address of core (NodePort 30080 on a node IP, set up in a later step)
  PROJECT_URL_CONFIG: "http://192.168.10.6:30080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-db-config
  namespace: core
data:
  POSTGRES_DB: "core_db"
