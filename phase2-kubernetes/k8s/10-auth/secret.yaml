# EXAMPLE VALUES - change every password and the JWT key before using this anywhere real.
# Credentials for the auth side (namespace: auth).
# stringData = plain text here; Kubernetes stores it base64-encoded (NOT encrypted).
# Letters and digits only in passwords: other characters can break the MySQL DSN.
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: auth
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "RootPass7391"
  MYSQL_USER: "auth_user"
  MYSQL_PASSWORD: "AuthPass4827"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: auth
type: Opaque
stringData:
  # Must match MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE above.
  # "auth-db" is the Service name of the database in the same namespace.
  DB_URL: "auth_user:AuthPass4827@tcp(auth-db:3306)/auth_db?charset=utf8mb4&parseTime=True&loc=Local"
  JWT_SECRET_KEY: "JwtSecretKey9f3a7c1e5b2d8046"
