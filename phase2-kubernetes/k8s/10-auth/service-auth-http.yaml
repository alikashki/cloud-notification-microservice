# External entry for the auth HTTP API only. A NodePort Service opens its port on EVERY
# node (30000-32767), so the gRPC port is kept out of this Service on purpose.
apiVersion: v1
kind: Service
metadata:
  name: auth-http
  namespace: auth
spec:
  type: NodePort
  selector:
    app: auth
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
