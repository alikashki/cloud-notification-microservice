# EXAMPLE VALUES - change every password and the JWT key before using this anywhere real.
# Same database account the auth service uses (a Secret cannot be shared across
# namespaces, so the values are repeated here and must stay identical).
apiVersion: v1
kind: Secret
metadata:
  name: user-manager-secret
  namespace: user-manager
type: Opaque
stringData:
  DB_USER: "auth_user"
  DB_PASSWORD: "AuthPass4827"
