# Headless Service (clusterIP: None): no virtual IP. A DNS lookup of
# core-headless.core.svc.cluster.local returns the IPs of all READY Pods, so NGINX can
# balance across the real replicas and notice when autoscaling adds or removes Pods.
apiVersion: v1
kind: Service
metadata:
  name: core-headless
  namespace: core
spec:
  clusterIP: None
  selector:
    app: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
