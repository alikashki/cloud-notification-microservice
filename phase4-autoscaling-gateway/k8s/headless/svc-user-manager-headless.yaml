# Headless Service (clusterIP: None): no virtual IP. A DNS lookup of
# user-manager-headless.user-manager.svc.cluster.local returns the IPs of all READY Pods, so NGINX can
# balance across the real replicas and notice when autoscaling adds or removes Pods.
apiVersion: v1
kind: Service
metadata:
  name: user-manager-headless
  namespace: user-manager
spec:
  clusterIP: None
  selector:
    app: user-manager
  ports:
    - name: http
      port: 8090
      targetPort: 8090
