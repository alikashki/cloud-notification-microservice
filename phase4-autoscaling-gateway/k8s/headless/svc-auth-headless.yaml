# Headless Service (clusterIP: None): no virtual IP. A DNS lookup of
# auth-headless.auth.svc.cluster.local returns the IPs of all READY Pods, so NGINX can
# balance across the real replicas and notice when autoscaling adds or removes Pods.
apiVersion: v1
kind: Service
metadata:
  name: auth-headless
  namespace: auth
spec:
  clusterIP: None
  selector:
    app: auth
  ports:
    - name: http
      port: 8082
      targetPort: 8082
