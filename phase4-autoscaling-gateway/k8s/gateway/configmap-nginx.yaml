apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gateway
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        # "upstream=" shows WHICH Pod (ip:port) served each request
        log_format gateway '$remote_addr [$time_local] "$request" $status '
                           'upstream=$upstream_addr rt=$request_time';
        access_log /dev/stdout gateway;

        # Cluster DNS. The backends below are resolved at request time (valid=5s), so Pods
        # created or removed by the autoscaler are picked up within seconds. When a name
        # resolves to several Pod IPs, NGINX spreads the requests across all of them.
        resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
        resolver_timeout 2s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # if a replica refuses the connection or times out, try another one
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        server {
            listen 8080;
            server_name _;

            # used by the Kubernetes readiness probe
            location = /nginx-health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # --- custom routing -------------------------------------------------
            # /user/...  -> auth service        (register, login, validate)
            location /user/ {
                set $backend "auth-headless.auth.svc.cluster.local:8082";
                add_header X-Served-By $upstream_addr always;
                proxy_pass http://$backend;
            }

            # /auth/...  -> user-manager service (list users, delete user)
            location /auth/ {
                set $backend "user-manager-headless.user-manager.svc.cluster.local:8090";
                add_header X-Served-By $upstream_addr always;
                proxy_pass http://$backend;
            }

            # everything else (/mail/..., /docs, ...) -> core service
            location / {
                set $backend "core-headless.core.svc.cluster.local:8080";
                add_header X-Served-By $upstream_addr always;
                proxy_pass http://$backend;
            }
        }
    }
