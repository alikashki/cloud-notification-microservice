# The single public entry of the system: NodePort 30100 on every node
# (inside the cluster it is also reachable as nginx.gateway.svc.cluster.local:80).
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: gateway
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30100
